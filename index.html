<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#fff2dc" />
<title>大狗Tap</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>" />
<script src="//s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
<style>
  :root {
    --cream: #fff2dc;
    --amber: #ffb400;
    --gray:  #87837e;
    --coral: #ff5a5f;
    --teal:  #16c2a3;
    --blue:  #3e7bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--cream);
    color: var(--gray);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    isolation: isolate;
    background: var(--cream);
    --scene-unit: 200px;
  }
  #fx {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }
  #author-link {
    position: absolute;
    right: max(18px, env(safe-area-inset-right));
    bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 30;
    padding: 10px 12px 11px;
    display: block;
    pointer-events: none;
    user-select: none;
  }
  .author-copy {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: 124px;
    gap: 5px;
  }
  .author-label,
  .author-name {
    width: 100%;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .author-label {
    color: rgba(255, 180, 0, .78);
    font: 600 9px/1 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: 0;
    text-transform: uppercase;
    white-space: nowrap;
    transform-origin: 50% 70%;
    transform:
      translateY(var(--author-lift, 0px))
      scale(var(--author-rhythm-scale, 1));
    transition: color .22s ease;
  }
  .author-name {
    width: calc(100% + 6px);
    margin-left: -3px;
    color: var(--amber);
    font: 700 20px/1.15 "Noto Serif SC", "Songti SC", SimSun, serif;
    letter-spacing: 0;
    white-space: nowrap;
    transition: color .22s ease;
  }
  .author-letter {
    display: inline-block;
    transform-origin: 50% 72%;
    will-change: transform;
  }
  #zoneflash {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }
  #key-grid {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: grid;
    grid-template-columns: repeat(var(--key-grid-cols, 4), minmax(0, 1fr));
    grid-template-rows: repeat(var(--key-grid-rows, 3), minmax(0, 1fr));
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  #key-grid.is-visible { opacity: 1; }
  .key-grid-cell {
    box-shadow: inset 0 0 0 .5px rgba(135, 131, 126, .14);
    background: rgba(255, 255, 255, .025);
  }
  #octave-controls {
    position: absolute;
    inset: 0;
    z-index: 12;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .2s ease, visibility 0s linear .2s;
  }
  #octave-controls.is-visible {
    opacity: 1;
    visibility: visible;
    transition-delay: 0s;
  }
  .octave-control {
    position: absolute;
    border: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: rgba(111, 106, 99, .72);
    background: rgba(255, 250, 240, .54);
    box-shadow: inset 0 0 0 1px rgba(135, 131, 126, .16);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    font: 650 clamp(10px, 1.25vmin, 12px)/1 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .04em;
    cursor: pointer;
    pointer-events: auto;
    touch-action: manipulation;
    transition: background .18s ease, color .18s ease, opacity .18s ease;
  }
  .octave-control:focus-visible {
    outline: 2px solid rgba(62, 123, 250, .32);
    outline-offset: -3px;
  }
  .octave-control:disabled {
    opacity: .34;
    cursor: default;
  }
  .octave-arrow {
    color: rgba(255, 180, 0, .62);
    font-size: 1.18em;
    font-weight: 800;
  }
  .octave-target { color: rgba(181, 126, 0, .68); }
  #octave-controls:not(.is-landscape) .octave-control {
    left: 0;
    width: 100%;
    min-height: 30px;
    height: clamp(30px, 4.5vh, 40px);
    flex-direction: row;
  }
  #octave-controls:not(.is-landscape) #octave-up {
    top: 0;
    padding: env(safe-area-inset-top) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  }
  #octave-controls:not(.is-landscape) #octave-down {
    bottom: 0;
    padding: 0 max(12px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(12px, env(safe-area-inset-left));
  }
  #octave-controls.is-landscape .octave-control {
    top: 0;
    height: 100%;
    min-width: 30px;
    width: clamp(30px, 3.6vw, 42px);
    flex-direction: column;
  }
  #octave-controls.is-landscape #octave-down {
    left: 0;
    padding: max(10px, env(safe-area-inset-top)) 0 max(10px, env(safe-area-inset-bottom)) env(safe-area-inset-left);
  }
  #octave-controls.is-landscape #octave-up {
    right: 0;
    padding: max(10px, env(safe-area-inset-top)) env(safe-area-inset-right) max(10px, env(safe-area-inset-bottom)) 0;
  }
  @media (hover: hover) {
    .octave-control:not(:disabled):hover {
      color: rgba(111, 106, 99, .9);
      background: rgba(255, 250, 240, .72);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    #octave-controls,
    .octave-control { transition: none; }
  }
  .zone-flash {
    position: absolute;
    background: #fff;
    border-radius: 0;
    opacity: 0;
    animation: zoneFade .45s ease-out forwards;
  }
  @keyframes zoneFade {
    0%   { opacity: .45; }
    100% { opacity: 0; }
  }
  #dog {
    position: absolute;
    inset: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    will-change: transform;
    transform-origin: 50% 62%;
  }
  #dog-inner {
    position: relative;
    width: var(--scene-unit);
    will-change: transform;
  }
  #dog-jelly {
    position: relative;
    will-change: transform, filter;
  }
  #dog-inner img {
    width: 100%;
    display: block;
    filter: drop-shadow(0 18px 40px rgba(135, 131, 126, .4));
  }
  #dog-open {
    position: absolute;
    left: 0; top: 0;
    opacity: 0;
    transition: opacity .08s linear;
  }
  #dog-inner.bark-image #dog-open { opacity: 1; }
  #dog-inner.is-hajimi #dog-open {
    visibility: hidden;
    transition: none;
  }
  #dog-inner.is-hajimi.bark-image #dog-close { visibility: hidden; }
  #dog-inner.is-hajimi.bark-image #dog-open { visibility: visible; }
  #dog-inner #dog-animation {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 70%;
    height: auto;
    display: block;
    opacity: 0;
    visibility: hidden;
    filter: drop-shadow(0 10px 20px rgba(105, 99, 93, .28));
    transform: translate(-50%, -50%);
    transition: none;
  }
  #dog-inner.is-hajimi.is-hajimi-animation #dog-close,
  #dog-inner.is-hajimi.is-hajimi-animation #dog-open {
    visibility: hidden;
  }
  #dog-inner.is-hajimi.is-hajimi-animation #dog-animation {
    opacity: 1;
    visibility: visible;
  }
  #top-controls {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
    z-index: 20;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    filter: drop-shadow(0 6px 14px rgba(135, 131, 126, .22));
    transition: opacity .5s ease, transform .5s cubic-bezier(.2, .8, .2, 1);
  }
  #top-controls.is-visible {
    opacity: 1;
    transform: translateY(0);
  }
  #top-controls.is-revealing-fast {
    transition-duration: .2s;
  }
  #audio-controls {
    opacity: 1;
    transform: translateY(0);
    transition: opacity .5s ease, transform .5s cubic-bezier(.2, .8, .2, 1);
  }
  #top-controls.has-update-dot:not(.is-visible) {
    opacity: 1;
    transform: translateY(0);
  }
  #top-controls.has-update-dot:not(.is-visible) #audio-controls {
    opacity: 0;
    transform: translateY(-8px);
  }
  #top-controls.has-update-dot:not(.is-visible) #audio-controls .control-button {
    pointer-events: none;
  }
  .control-group {
    display: flex;
    gap: 8px;
  }
  .control-button {
    --btn-edge: rgba(135, 131, 126, .72);
    --btn-fill: rgba(255, 242, 220, .92);
    position: relative;
    min-width: 68px;
    min-height: 44px;
    padding: 8px 12px;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--gray);
    background: var(--btn-edge);
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px),
                       calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
    font: 700 13px/1 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    cursor: pointer;
    pointer-events: auto;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transform: scale(var(--rhythm-scale, 1));
    transition: color .2s ease, background .2s ease;
  }
  .control-button::before {
    content: "";
    position: absolute;
    inset: 2px;
    z-index: -1;
    background: var(--btn-fill);
    clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px),
                       calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
    transition: background .2s ease;
  }
  .control-button:active { transform: scale(.94); }
  .control-button:focus-visible {
    outline: 3px solid rgba(62, 123, 250, .38);
    outline-offset: 2px;
  }
  @media (hover: hover) {
    .control-button:hover { --btn-edge: rgba(255, 180, 0, .85); }
  }
  .control-button svg {
    width: 20px;
    height: 20px;
    overflow: visible;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .control-button .mute-slash {
    opacity: 0;
    stroke: var(--coral);
    stroke-width: 2.6;
    transition: opacity .2s ease;
  }
  .control-button.is-muted {
    --btn-edge: rgba(255, 90, 95, .68);
    --btn-fill: rgba(255, 255, 255, .94);
    color: var(--coral);
  }
  .control-button.is-muted .mute-slash { opacity: 1; }
  #settings-wrap { position: relative; }
  #update-dot {
    position: absolute;
    top: -5px;
    right: -5px;
    z-index: 2;
    width: 15px;
    height: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 250, 240, .96);
    clip-path: polygon(32% 0, 68% 0, 100% 32%, 100% 68%, 68% 100%, 32% 100%, 0 68%, 0 32%);
    filter: drop-shadow(0 0 3px rgba(255, 90, 95, .55));
    pointer-events: none;
    transform: scale(var(--rhythm-scale, 1));
    will-change: transform;
  }
  #update-dot::before {
    content: "";
    width: 9px;
    height: 9px;
    background: var(--coral);
    clip-path: polygon(32% 0, 68% 0, 100% 32%, 100% 68%, 68% 100%, 32% 100%, 0 68%, 0 32%);
  }
  #update-dot.is-hidden { display: none; }
  #settings-hint {
    position: absolute;
    top: calc(100% + 9px);
    right: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-6px) scale(.92);
    transform-origin: top right;
    filter: drop-shadow(0 6px 12px rgba(255, 180, 0, .38));
    transition: opacity .3s ease, transform .34s cubic-bezier(.34, 1.4, .4, 1);
  }
  #top-controls.has-update-dot #settings-hint {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .settings-hint-bob {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    animation: settingsHintBob 1.5s ease-in-out infinite;
  }
  @keyframes settingsHintBob {
    50% { transform: translateY(-4px); }
  }
  .settings-hint-arrow {
    width: 20px;
    height: 24px;
    margin-right: 17px;
    margin-bottom: -2px;
    color: var(--amber);
    fill: none;
    stroke: currentColor;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .settings-hint-bubble {
    padding: 8px 13px 9px;
    color: #fffaf0;
    background: var(--amber);
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px),
                       calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
    font: 750 12px/1.55 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .04em;
    text-align: center;
    white-space: nowrap;
  }
  @media (prefers-reduced-motion: reduce) {
    .settings-hint-bob { animation: none; }
  }
  #toy-notice {
    position: absolute;
    left: 50%;
    bottom: max(24px, calc(env(safe-area-inset-bottom) + 16px));
    z-index: 60;
    width: min(420px, calc(100% - 32px));
    padding: 12px 16px;
    color: #6f6a63;
    background: rgba(255, 250, 240, .97);
    border: 2px solid rgba(255, 180, 0, .72);
    border-radius: 12px;
    box-shadow: 0 10px 28px rgba(135, 131, 126, .24);
    font-size: 13px;
    font-weight: 650;
    line-height: 1.55;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 12px) scale(.98);
    transition: opacity .2s ease, transform .2s ease;
  }
  #toy-notice.is-visible {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
  #toy-notice.is-error {
    color: #9e4145;
    border-color: rgba(255, 90, 95, .72);
  }
  @media (max-width: 430px) {
    #top-controls {
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      right: max(10px, env(safe-area-inset-right));
    }
    .control-button {
      min-width: 44px;
      padding-inline: 10px;
    }
    .control-button span { display: none; }
    #author-link {
      right: max(10px, env(safe-area-inset-right));
      bottom: max(10px, env(safe-area-inset-bottom));
      min-width: 0;
      max-width: calc(100% - 20px);
      padding: 8px 9px 7px 12px;
    }
    .author-copy { width: 106px; }
    .author-name {
      width: calc(100% + 4px);
      margin-left: -2px;
      font-size: 15px;
    }
  }
  #overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 2.2vmin;
    align-items: center;
    justify-content: center;
    background: rgba(255, 242, 220, .9);
    transition: opacity .5s ease;
    cursor: pointer;
  }
  #overlay.hide { opacity: 0; pointer-events: none; }
  #overlay .title {
    font-size: clamp(34px, 8vmin, 72px);
    font-weight: 900;
    letter-spacing: .18em;
    color: var(--amber);
  }
  #overlay .title em { font-style: normal; color: var(--gray); }
  #overlay .sub {
    font-size: clamp(13px, 2.4vmin, 18px);
    letter-spacing: .5em;
    color: var(--gray);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }
  #settings-overlay {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: rgba(255, 242, 220, .88);
    opacity: 0;
    pointer-events: none;
    transition: opacity .28s ease;
  }
  #settings-overlay.is-open {
    opacity: 1;
    pointer-events: auto;
  }
  #settings-panel {
    position: relative;
    width: min(384px, 100%);
    background: rgba(135, 131, 126, .5);
    clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 18px),
                       calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px), 0 18px);
    filter: drop-shadow(0 14px 34px rgba(135, 131, 126, .3));
    transform: translateY(10px) scale(.97);
    transition: transform .32s cubic-bezier(.2, .8, .2, 1);
  }
  #settings-overlay.is-open #settings-panel {
    transform: translateY(0) scale(1);
  }
  #settings-panel::before {
    content: "";
    position: absolute;
    inset: 2px;
    z-index: -1;
    background: rgba(255, 250, 240, .97);
    clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 16px, 100% calc(100% - 16px),
                       calc(100% - 16px) 100%, 16px 100%, 0 calc(100% - 16px), 0 16px);
  }
  .settings-scroll {
    max-height: min(740px, calc(100vh - 44px));
    overflow-y: auto;
    padding: 14px 16px 16px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 180, 0, .45) transparent;
  }
  .settings-scroll::-webkit-scrollbar { width: 6px; }
  .settings-scroll::-webkit-scrollbar-track { background: transparent; }
  .settings-scroll::-webkit-scrollbar-thumb {
    background: rgba(255, 180, 0, .45);
    border-radius: 999px;
  }
  .settings-scroll::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 180, 0, .7);
  }
  .settings-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .settings-title {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: .3em;
    color: var(--amber);
  }
  .settings-title em { font-style: normal; color: var(--gray); }
  #settings-close {
    min-width: 40px;
    min-height: 36px;
    padding: 6px;
  }
  .settings-section { margin-top: 10px; }
  .settings-section:first-of-type { margin-top: 0; }
  .settings-label {
    margin-bottom: 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .24em;
    color: rgba(135, 131, 126, .78);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .performance-settings {
    display: grid;
    gap: 6px;
  }
  .setting-row {
    --btn-edge: rgba(135, 131, 126, .42);
    --btn-fill: rgba(255, 255, 255, .62);
    position: relative;
    isolation: isolate;
    width: 100%;
    min-height: 50px;
    padding: 8px 12px;
    border: none;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--gray);
    background: var(--btn-edge);
    clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px),
                       calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px);
    font: inherit;
    text-align: left;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background .2s ease, opacity .2s ease;
  }
  .setting-row[hidden] { display: none; }
  .setting-row::before {
    content: "";
    position: absolute;
    inset: 2px;
    z-index: -1;
    background: var(--btn-fill);
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px),
                       calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
    transition: background .2s ease;
  }
  @media (hover: hover) {
    .setting-row:not(:disabled):hover { --btn-edge: rgba(255, 180, 0, .72); }
  }
  .setting-row:focus-visible {
    outline: 3px solid rgba(62, 123, 250, .34);
    outline-offset: 2px;
  }
  .setting-row:disabled {
    opacity: .58;
    cursor: not-allowed;
  }
  .setting-row[aria-checked="true"] {
    --btn-edge: rgba(255, 180, 0, .78);
    --btn-fill: rgba(255, 244, 224, .96);
  }
  .setting-copy {
    flex: 1;
    min-width: 0;
  }
  .setting-name {
    display: block;
    color: #6f6a63;
    font-size: 13px;
    font-weight: 750;
    line-height: 1.35;
  }
  .setting-row[aria-checked="true"] .setting-name { color: #b57e00; }
  .setting-description {
    display: block;
    margin-top: 2px;
    color: rgba(135, 131, 126, .82);
    font-size: 11px;
    line-height: 1.4;
  }
  .setting-switch {
    position: relative;
    flex: none;
    width: 46px;
    height: 26px;
    background: rgba(135, 131, 126, .38);
    clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px),
                       calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px);
    transition: background .22s ease;
  }
  .setting-switch::after {
    content: "";
    position: absolute;
    left: 4px;
